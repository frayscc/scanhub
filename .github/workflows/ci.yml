name: Validate ScanHub
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker build -t scanhub:ci .
      - name: Test standalone no-auth receiver in container
        run: |
          docker run -d --name scanhub-minimal-ci -p 127.0.0.1:18687:8080 scanhub:ci python -m uvicorn scanhub.minimal:app --host 0.0.0.0 --port 8080 --no-access-log
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18687/', timeout=2) as response:
                      assert json.load(response)['mode'] == 'minimal-no-auth'
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise RuntimeError('Minimal receiver did not start')
          PY
          test "$(curl -fsS -F 'paper=@frontend/e2e/scan.png' http://127.0.0.1:18687/api/upload)" = 'OK'
          docker exec scanhub-minimal-ci python -c "import json,pathlib; p=pathlib.Path('/data/minimal'); r=json.loads(next(p.glob('*/request.json')).read_text()); assert r['files'][0]['field']=='paper'; assert r['files'][0]['bytes']>0; assert not pathlib.Path('/data/scanhub.db').exists()"
      - name: Remove standalone test container
        if: always()
        run: docker rm -f scanhub-minimal-ci || true
      - run: python scripts/acceptance.py prepare
      - run: mkdir -p test-results/acceptance-data && sudo chown 10001:10001 test-results/acceptance-data
      - run: docker compose -f docker-compose.acceptance.yml up -d --wait --wait-timeout 120
      - run: python scripts/acceptance.py run --confirm-isolated
      - run: docker compose -f docker-compose.acceptance.yml restart
      - run: docker compose -f docker-compose.acceptance.yml up -d --wait --wait-timeout 120
      - run: python scripts/acceptance.py verify --confirm-isolated
      - if: always()
        run: docker compose -f docker-compose.acceptance.yml down
